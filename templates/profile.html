{% extends 'base.html' %}{% block title %}Profile · UniPortal{% endblock %}{% block content %}<div class="eyebrow">MY ACCOUNT</div><h1>Profile Settings</h1><section class="card narrow"><p class="muted">You can update only your own profile. Your account ID, username and role are not editable.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input value="{{ current_user['username'] }}" disabled></label><label>Role<input value="{{ current_user['role'] }}" disabled></label><label>Full Name<input name="full_name" value="{{ current_user['full_name'] }}" maxlength="100" required></label><label>Email<input name="email" type="email" value="{{ current_user['email'] }}" maxlength="200" required></label><label>Phone<input name="phone" value="{{ current_user['phone'] }}" maxlength="30"></label><button class="primary" type="submit">Save Changes</button></form></section>{% endblock %}
